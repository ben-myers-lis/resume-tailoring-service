name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice (PDF output)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui fonts-crosextra-carlito

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Run tests (mock AI, simulated Google Drive; no secrets needed)
        run: python -m pytest -q tests

      - name: Check the prompt package's own tests
        working-directory: prompt_package
        run: python -m unittest discover -s tests

  postgres:
    # The same tests against Postgres (as used on Vercel), with ReportLab PDFs and files stored in the database.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rts_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rts_test
      RTS_PDF_ENGINE: reportlab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Run tests on Postgres
        run: python -m pytest -q tests

      - name: Check the queue subscriber imports with the real Vercel SDK
        run: python -c "import rts_worker; print('subscriber OK:', rts_worker.tailor_run)"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t resume-tailoring:ci .
      - name: Start it and check health
        run: |
          docker run -d --name rts -p 8000:8000 -e RTS_AI_PROVIDER=mock resume-tailoring:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs rts; exit 1
